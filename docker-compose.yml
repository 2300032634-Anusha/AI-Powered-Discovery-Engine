version: '3.8'

services:
  # MySQL Database
  mysql-db:
    image: mysql:8.0
    container_name: discovery-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 2110570
      MYSQL_DATABASE: discovery_engine_db
    volumes:
      - mysql-data:/var/lib/mysql
      - ./server/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Server
  discovery-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: discovery-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=2110570
      - DB_NAME=discovery_engine_db
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      mysql-db:
        condition: service_healthy

  # Frontend Web App
  discovery-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discovery-web
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
      - VECTOR_INDEX_TYPE=HNSW32
    restart: always
    depends_on:
      - discovery-api

  # Simulated FAISS Vector Service
  faiss-vector-service:
    image: python:3.11-slim
    command: python -c "print('FAISS Vector Engine Running on 50051')"
    ports:
      - "50051:50051"
    environment:
      - EMBEDDING_DIM=512

  # Redis Cache Layer
  redis-cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

volumes:
  mysql-data:
